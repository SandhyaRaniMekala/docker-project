name: Docker Project Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t my-web-app:latest .
      - name: Verify Docker Image
        run: docker images